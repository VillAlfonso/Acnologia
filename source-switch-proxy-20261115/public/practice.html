<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BrowserAuto — Practice page</title><link rel="stylesheet" href="/style.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:30px}.practice{width:440px;max-width:100%;background:white;border:1px solid var(--border);border-radius:16px;padding:36px;box-shadow:0 10px 60px #31513209}.practice .brand{margin-bottom:35px}.practice h1{font-size:28px}.practice>p{font-size:12px;color:#929b91;line-height:1.8}.practice .form-field{font-size:12px}.practice input,.practice select{padding:12px}.practice .button{width:100%;margin-top:15px}.practice label.check-row{border:0;padding:10px 0;font-size:11px}#result{padding:22px;background:#eef6e9;border:1px solid #ddecd4;border-radius:8px;color:#68855b;margin-top:20px;line-height:1.8}.practice small{font-size:10px;display:block;text-align:center;color:#a0aa99;margin-top:22px}</style></head><body><div class="practice"><a class="brand" href="/"><span class="brand-mark">b<span>↗</span></span>BrowserAuto</a><div class="eyebrow">YOUR AUTOMATION PLAYGROUND</div><h1>Welcome to the team<span class="heading-dot">.</span></h1><p>A safe place to try your first workflow. This form only updates this page.</p><form id="practice-form"><label class="form-field" for="full-name">Full name<input id="full-name" name="name" placeholder="Alex Morgan" required></label><label class="form-field" for="email">Email address<input id="email" name="email" type="email" placeholder="alex@example.test" required></label><label class="form-field" for="team">Team<select id="team" name="team"><option value="">Choose a team</option><option>Engineering</option><option>Design</option><option>Operations</option></select></label><label class="check-row" for="consent"><input id="consent" name="consent" type="checkbox" required>I accept this demo invitation</label><button id="submit" class="button primary" type="submit">Submit demo form ↗</button></form><div id="result" role="status" hidden></div><small>Practice page · No external data is submitted</small></div><script>document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const result=document.querySelector('#result');result.textContent=`Welcome, ${document.querySelector('#full-name').value}! Your ${document.querySelector('#team').value || 'new'} team is ready.`;result.hidden=false;});</script></body></html>
